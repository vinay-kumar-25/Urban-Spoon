<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Bungee+Tint&family=Coustard:wght@400;900&family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
    <style>
        :root{
    
    --body_color:#757575;
    --body_background:#ffffff;
    --green:#719a0a;
    --orange:#fbaf32;
    --green-light: #C9E7A4; /* Even Softer Green for Backgrounds */
    --orange-light: #FFDBA4; /* Softer Orange for Accents */
    --footer_color:#454545;
    --light-gray: #f0f0f0;
    --gray: #808080;
    --dark-gray: #555;
}
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Nunito;
}
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f8f8f8;
        }
        .registration-selection {
            background: #ffffff;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 70%;
            height: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            position: relative;
        }
        .registration-selection h2 {
            color: #333;
            font-size: 1.5rem;
        }
        .input-group {
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .input-group label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
        .select_1 {
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.8rem;
            border: 2px solid transparent;
            border-radius: 0.5rem;
            font-size: 1rem;
            background: #f5f5f5;
            cursor: pointer;
            position: relative;
            z-index: 3; 
            margin-bottom: 3rem;
            outline: none;
        }
        .select_1:focus{
            border: 2px solid var(--orange);
        }
        .proceed-btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            background-color: var(--green);
            color: white;
            border: 2px solid var(--green);
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            z-index: 1; 
            position: relative;
        }
        .proceed-btn:hover {
            background-color:transparent;
            color: var(--green);
        }
    </style>
</head>
<body>
    <div class="registration-selection">
        <h2>Select Registration Type</h2>
        <div class="input-group">
            <label for="register-type">Choose type</label>
            <select id="register-type" class="select_1">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button class="proceed-btn" onclick="redirectToRegister()">Proceed</button>
    </div>

    <script>
        function redirectToRegister() {
            let registerType = document.getElementById("register-type").value;
            if (registerType === "user") {
                window.location.href = "user-register.html";
            } else {
                window.location.href = "admin-register.html";
            }
        }
    </script>
</body>
</html>
