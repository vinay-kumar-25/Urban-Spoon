<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Bungee+Tint&family=Coustard:wght@400;900&family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
    <style>
        :root {
            --body_color: #757575;
            --body_background: #ffffff;
            --green: #719a0a;
            --orange: #fbaf32;
            --green-light: #C9E7A4;
            --orange-light: #FFDBA4;
            --footer_color: #454545;
            --light-gray: #f0f0f0;
            --gray: #808080;
            --dark-gray: #555;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Nunito;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .container {
            display: flex;
            gap: 2rem;
min-width: 40%;
border-radius: 1rem;
           
        }
       
        .add-admin-btn {
            background: var(--orange);
            align-self: center;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: 0.3s;
            
        }
        .add-admin-btn:hover {
            background: var(--green);
        }
        .register-form {
            /* background: white; */
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            flex-flow: column ;
            border: 2px solid var(--light-gray);
            width: 100%;
            
        }
      
        .register-form h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--dark-gray);
            align-self: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: var(--gray);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--gray);
            border-radius: 0.5rem;
            font-size: 1rem;
            background: var(--light-gray);
        }
        .form-group input:focus {
            border-color: var(--green);
            outline: none;
            background: white;
        }
        #key{
            color: rgb(223, 47, 82);
        }
        #admin-key:focus{
            border-color: rgb(222, 54, 88);
        }
        #admin-key::placeholder{
            color: rgb(223, 73, 103);
        }
        @media (max-width:1100px) {
            .container{
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
       
        
        <form id="register-form" class="register-form">
            <h2>Admin Registration</h2>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="first-name" placeholder="First Name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="last-name" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Email address" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Phone number" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <label id="key">Admin Key</label>
                <input type="password" id="admin-key" placeholder="Security Key" required>
            </div>
            
                <input type="submit" class="add-admin-btn" value="Register">
        </form>
        
</div>
 
    <script type="module" src="../firebase-config.js"></script>
    <script type="module" src="admin-reg.js"></script>
</body>
</html>
