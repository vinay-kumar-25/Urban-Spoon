<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Spoon Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="side_back">
      <aside class="sidebar">
        <h2>Urban</h2><h2>Spoon</h2>
        <div class="dynamic-content">
          <!-- Dynamic items go here -->
        </div>
      </aside>
    </div>

    <!-- Main Content -->
    <main class="main">
      <header class="top-bar">
        <div class="dashboard">Dashboard Overview</div>
        <div class="admin">Admin Panel <span class="flag">🏳️‍🌈</span></div>
      </header>

      <section class="grid-content">
        <!-- Left Panel -->
        <div class="left-top-panel">
          <div class="favourite-dishes">
            <h2>Top Favourite Dishes</h2>
            <div class="fav-content">
              <!-- Dish items will be dynamically inserted here using JavaScript -->
            </div>
          </div>
          

          <div class="info-card">
            <div class="pie" id="revenuePie"></div>
            <div class="info-text">Total Revenue</div>
          </div>
          
          <div class="info-card">
            <div class="pie" id="ordersPie"></div>
            <div class="info-text">Live Orders</div>
          </div>
          
          <div class="info-card">
            <div class="pie" id="usersPie"></div>
            <div class="info-text">Registered Users</div>
          </div>

          <div class="booked-tables">
            <h2>Recent Table Bookings</h2>
            <div class="table-content"></div>
          </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
          <div class="small-card">
            <h2>Loyal Customers</h2>
            <div class="loyal-customers-content"></div>
          </div>
          
          <div class="small-card" id="ongoing-orders-card">
            <span class="card-title">Ongoing Orders</span>
            <span class="card-value">0</span> </div>

            
          <div class="testimonials">
            <h2>Customer Testimonials</h2>
            <div class="testimonials-content"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
